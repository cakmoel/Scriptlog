  /query:
    x-query:
      tags:
        - Query
      summary: Query all content (QUERY method)
      description: |
        Executes a server-side query from a JSON request body, per
        RFC 10008. Send `{"q": "keyword"}` (`keyword` is accepted as an
        alias) with an optional `type` of `all` (default), `posts` or
        `pages`. Safe and idempotent like GET: cacheable, retryable, and
        counted under the read rate limit. Responds with
        `Accept-Query: application/json`.
        NOTE: OpenAPI 3.0 defines no `query` operation type, so this
        operation is documented under the `x-query` extension field with
        an otherwise standard operation shape. The real HTTP method is
        `QUERY`, e.g. `curl -X QUERY /api/v1/query -d '{"q":"php"}'`.
      operationId: queryAll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /query/posts:
    x-query:
      tags:
        - Query
      summary: Query posts only (QUERY method)
      description: |
        Like `QUERY /query` but restricted to blog posts (`type` is
        forced to `posts`). The real HTTP method is `QUERY`.
      operationId: queryPosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Post query executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /query/pages:
    x-query:
      tags:
        - Query
      summary: Query pages only (QUERY method)
      description: |
        Like `QUERY /query` but restricted to static pages (`type` is
        forced to `pages`). The real HTTP method is `QUERY`.
      operationId: queryPages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Page query executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /health:
    get:
      tags:
        - System
      summary: Health check
      description: |
        Returns the API health status for monitoring and load balancers.
        This endpoint is public and does not require authentication.
      operationId: healthCheck
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /openapi.json:
    get:
      tags:
        - System
      summary: Get OpenAPI specification
      description: |
        Returns this OpenAPI 3.0 specification. The `servers` entry is a
        relative URL (`/api/v1`) that resolves on any host without
        substitution; only the `info.x-logo` URL is replaced at runtime
        with the configured app URL. Served dynamically from the
        `openapi.json` file at the project root.
        This endpoint is public and does not require authentication.
      operationId: getOpenApiSpec
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /csrf-token:
    get:
      tags:
        - System
      summary: Get CSRF token
      description: |
        Issues a CSRF token for session-authenticated write requests.
        Send it back as the `X-CSRF-Token` header. Requests using an
        API key or Bearer token are exempt from CSRF validation.
        This endpoint is public and does not require authentication.
      operationId: getCsrfToken
      responses:
        '200':
          description: CSRF token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key authentication. Pass your API key in the X-API-Key header.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication. Pass your bearer token in the Authorization header.

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PerPage:
      name: per_page
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    SortBy:
      name: sort_by
      in: query
      description: Field to sort by
      required: false
      schema:
        type: string
        default: ID
        enum:
          - ID
          - post_date
          - post_modified
          - post_title
          - topic_title
          - comment_date
    SortOrder:
      name: sort_order
      in: query
      description: Sort direction
      required: false
      schema:
        type: string
        enum:
          - ASC
          - DESC
        default: DESC
    PostId:
      name: id
      in: path
      description: Post ID
      required: true
      schema:
        type: integer
        example: 1
    CategoryId:
      name: id
      in: path
      description: Category ID
      required: true
      schema:
        type: integer
        example: 1
    CommentId:
      name: id
      in: path
      description: Comment ID
      required: true
      schema:
        type: integer
        example: 1

  schemas:
    # Base Schemas
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 400
        error:
          type: object
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
              example: Error description
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Operation successful
        data:
          type: object
        _links:
          $ref: '#/components/schemas/Links'

    # Post Schemas
    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: My First Blog Post
        slug:
          type: string
          example: my-first-blog-post
        content:
          type: string
          example: Full post content here...
        summary:
          type: string
          nullable: true
          example: Post summary for preview
        excerpt:
          type: string
          example: Generated excerpt...
        status:
          type: string
          enum:
            - publish
            - draft
            - pending
            - private
          example: publish
        visibility:
          type: string
          enum:
            - public
            - private
            - protected
          example: public
        tags:
          type: array
          items:
            type: string
          example:
            - php
            - rest-api
        comment_status:
          type: string
          enum:
            - open
            - closed
          example: open
        type:
          type: string
          example: blog
        author:
          type: object
          properties:
            id:
              type: integer
              example: 1
            login:
              type: string
              example: admin
            name:
              type: string
              example: Administrator
        date:
          type: string
          format: date-time
          example: 2024-01-15 10:30:00
        modified:
          type: string
          format: date-time
          nullable: true
          example: 2024-01-15 14:20:00
        url:
          type: string
          example: http://blogware.site/post/1/my-first-blog-post

    PostCreate:
      type: object
      required:
        - post_title
        - post_content
      properties:
        post_title:
          type: string
          maxLength: 200
          example: My First Blog Post
        post_content:
          type: string
          example: Full post content here...
        post_summary:
          type: string
          maxLength: 320
          nullable: true
          example: Post summary
        post_status:
          type: string
          enum:
            - publish
            - draft
          default: draft
        post_visibility:
          type: string
          enum:
            - public
            - private
            - protected
          default: public
        post_tags:
          type: string
          nullable: true
          example: php, api, rest
        comment_status:
          type: string
          enum:
            - open
            - closed
          default: open
        topics:
          type: array
          items:
            type: integer
          example:
            - 1
            - 2

    PostUpdate:
      type: object
      properties:
        post_title:
          type: string
          maxLength: 200
        post_content:
          type: string
        post_summary:
          type: string
          maxLength: 320
          nullable: true
        post_status:
          type: string
          enum:
            - publish
            - draft
            - pending
            - private
        post_visibility:
          type: string
          enum:
            - public
            - private
            - protected
        post_tags:
          type: string
          nullable: true
        comment_status:
          type: string
          enum:
            - open
            - closed
        topics:
          type: array
          items:
            type: integer

    PostListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            pagination:
              $ref: '#/components/schemas/Pagination'

    PostDetailResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Post'
                - type: object
                  properties:
                    topics:
                      type: array
                      items:
                        $ref: '#/components/schemas/CategorySummary'
                    featured_image:
                      type: string
                      nullable: true
                      example: http://blogware.site/public/files/pictures/featured.jpg

    PostResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Post'

    # Category Schemas
    CategorySummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Technology
        slug:
          type: string
          example: technology

    Category:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          properties:
            status:
              type: string
              enum:
                - Y
                - N
              example: Y
            post_count:
              type: integer
              example: 15
            url:
              type: string
              example: http://blogware.site/category/technology

    CategoryCreate:
      type: object
      required:
        - topic_title
      properties:
        topic_title:
          type: string
          maxLength: 255
          example: Technology
        topic_status:
          type: string
          enum:
            - Y
            - N
          default: Y

    CategoryUpdate:
      type: object
      properties:
        topic_title:
          type: string
          maxLength: 255
        topic_status:
          type: string
          enum:
            - Y
            - N

    CategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'
            pagination:
              $ref: '#/components/schemas/Pagination'

    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Category'

    CategoryPostsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                category:
                  $ref: '#/components/schemas/CategorySummary'
                posts:
                  type: array
                  items:
                    $ref: '#/components/schemas/Post'
            pagination:
              $ref: '#/components/schemas/Pagination'

    # Comment Schemas
    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        post_id:
          type: integer
          example: 1
        parent_id:
          type: integer
          example: 0
        author:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            email:
              type: string
              example: john@example.com
        content:
          type: string
          example: Great article!
        status:
          type: string
          enum:
            - approved
            - pending
            - spam
          example: approved
        date:
          type: string
          format: date-time
          example: 2024-01-15 10:30:00

    CommentCreate:
      type: object
      required:
        - comment_author_name
        - comment_content
        - comment_post_id
      properties:
        comment_author_name:
          type: string
          maxLength: 60
          example: John Doe
        comment_author_email:
          type: string
          format: email
          nullable: true
          example: john@example.com
        comment_content:
          type: string
          example: Great article!
        comment_post_id:
          type: integer
          example: 1
        comment_parent_id:
          type: integer
          default: 0
          example: 0

    CommentUpdate:
      type: object
      properties:
        comment_author_name:
          type: string
          maxLength: 60
        comment_content:
          type: string
        comment_status:
          type: string
          enum:
            - approved
            - pending
            - spam

    CommentListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            pagination:
              $ref: '#/components/schemas/Pagination'

    CommentResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Comment'
                - type: object
                  properties:
                    post:
                      type: object
                      properties:
                        title:
                          type: string
                        slug:
                          type: string
                        url:
                          type: string
                      nullable: true

    # Archive Schemas
    ArchiveMonth:
      type: object
      properties:
        month:
          type: integer
          example: 6
        month_name:
          type: string
          example: June
        post_count:
          type: integer
          example: 5

    ArchiveYear:
      type: object
      properties:
        year:
          type: integer
          example: 2024
        months:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveMonth'
        total_posts:
          type: integer
          example: 25

    ArchiveListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                archives:
                  type: array
                  items:
                    $ref: '#/components/schemas/ArchiveYear'
                total_years:
                  type: integer
                  example: 3

    ArchiveYearResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                year:
                  type: integer
                  example: 2024
                posts:
                  type: array
                  items:
                    $ref: '#/components/schemas/Post'
            pagination:
              $ref: '#/components/schemas/Pagination'

    ArchiveMonthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                year:
                  type: integer
                  example: 2024
                month:
                  type: integer
                  example: 6
                month_name:
                  type: string
                  example: June
                posts:
                  type: array
                  items:
                    $ref: '#/components/schemas/Post'
            pagination:
              $ref: '#/components/schemas/Pagination'

    # Utility Schemas
    Link:
      type: object
      description: HATEOAS link following RFC 5988 (Web Linking)
      properties:
        href:
          type: string
          description: The URL of the linked resource
          example: http://blogware.site/api/v1/posts
        rel:
          type: string
          description: The relationship type
          example: self
        type:
          type: string
          description: The HTTP method or MIME type
          example: GET
        templated:
          type: boolean
          description: Whether the URL is a URI template
          example: false
      required:
        - href
        - rel

    Links:
      type: object
      description: HATEOAS links for discoverable API navigation
      additionalProperties:
        $ref: '#/components/schemas/Link'
      example:
        self:
          href: http://blogware.site/api/v1/posts?page=1
          rel: self
          type: GET
        next:
          href: http://blogware.site/api/v1/posts?page=2
          rel: next
          type: GET
        collection:
          href: http://blogware.site/api/v1/posts
          rel: collection
          type: GET

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total_items:
          type: integer
          example: 50
        total_pages:
          type: integer
          example: 5
        has_next_page:
          type: boolean
          example: true
        has_previous_page:
          type: boolean
          example: false

    DeleteResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: null
              example: null

    ApiInfo:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                name:
                  type: string
                  example: Blogware RESTful API
                version:
                  type: string
                  example: 1.1.2
                description:
                  type: string
                base_url:
                  type: string
                  example: /api/v1
                authentication:
                  type: object
                  properties:
                    type:
                      type: string
                    header:
                      type: string
                    required:
                      type: boolean

    # Search Schemas
    SearchResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: My First Blog Post
        slug:
          type: string
          example: my-first-blog-post
        excerpt:
          type: string
          example: Matching content excerpt...
        type:
          type: string
          enum:
            - blog
            - page
          example: blog
        date:
          type: string
          format: date-time
          example: 2024-01-15 10:30:00
        url:
          type: string
          example: http://blogware.site/post/1/my-first-blog-post

    SearchResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                keyword:
                  type: string
                  example: php
                type:
                  type: string
                  enum:
                    - all
                    - posts
                    - pages
                  example: all
                total:
                  type: integer
                  description: Total result count (also read by the sidebar widget)
                  example: 7
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/SearchResult'
                pagination:
                  $ref: '#/components/schemas/Pagination'

    # QUERY Method Schemas (RFC 10008)
    QueryRequest:
      type: object
      description: JSON body for QUERY /query, /query/posts and /query/pages
      properties:
        q:
          type: string
          description: Search keyword (`keyword` is accepted as an alias)
          example: php
        keyword:
          type: string
          description: Alias of `q`
          example: php
        type:
          type: string
          description: Search scope (forced by the /posts and /pages variants)
          enum:
            - all
            - posts
            - pages
          default: all
          example: all

    QueryResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: My First Blog Post
        slug:
          type: string
          example: my-first-blog-post
        excerpt:
          type: string
          description: 200-character plain-text excerpt
          example: Matching content excerpt...
        type:
          type: string
          example: blog
        date:
          type: string
          format: date-time
          example: 2024-01-15 10:30:00
        status:
          type: string
          example: publish

    QueryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                query:
                  type: object
                  properties:
                    keyword:
                      type: string
                      example: php
                    type:
                      type: string
                      enum:
                        - all
                        - posts
                        - pages
                      example: all
                total:
                  type: integer
                  example: 3
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/QueryResult'

    # Protected Post Schemas
    ProtectedPostVerify:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: Password of the protected post
          example: post-password

    ProtectedPostVerifyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                valid:
                  type: boolean
                  example: true

    ProtectedPostUnlockResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                content:
                  type: string
                  description: Sanitized decrypted post content
                  example: <p>Secret content...</p>

    # GDPR Schemas
    GdprConsent:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Consent decision recorded with the client IP and user agent
          enum:
            - accepted
            - rejected
          example: accepted

    GdprConsentResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                consent_given:
                  type: boolean
                  description: Present on GET /gdpr/consent
                  example: true
                consent_type:
                  type: string
                  description: Present on GET /gdpr/consent
                  example: cookie
                status:
                  type: string
                  description: Present on POST /gdpr/consent
                  enum:
                    - accepted
                    - rejected
                  example: accepted
                message:
                  type: string
                  description: Present on POST /gdpr/consent
                  example: Consent recorded successfully
                timestamp:
                  type: string
                  description: Present on POST /gdpr/consent
                  format: date-time
                  example: 2026-07-30 12:00:00

    # Language Schemas
    Language:
      type: object
      properties:
        ID:
          type: integer
          example: 1
        lang_code:
          type: string
          example: en
        lang_name:
          type: string
          example: English
        lang_native:
          type: string
          example: English
        lang_locale:
          type: string
          nullable: true
          example: en_US
        lang_direction:
          type: string
          enum:
            - ltr
            - rtl
          example: ltr
        lang_sort:
          type: integer
          example: 0
        lang_is_default:
          type: integer
          enum:
            - 0
            - 1
          example: 1

    LanguageCreate:
      type: object
      required:
        - lang_code
        - lang_name
        - lang_native
      properties:
        lang_code:
          type: string
          example: de
        lang_name:
          type: string
          example: German
        lang_native:
          type: string
          example: Deutsch
        lang_locale:
          type: string
          nullable: true
          example: de_DE
        lang_direction:
          type: string
          enum:
            - ltr
            - rtl
          default: ltr
        lang_sort:
          type: integer
          default: 0
        lang_is_default:
          type: integer
          enum:
            - 0
            - 1
          default: 0

    LanguageUpdate:
      type: object
      description: Partial language fields; passed straight to the service layer.
      properties:
        lang_name:
          type: string
        lang_native:
          type: string
        lang_locale:
          type: string
          nullable: true
        lang_direction:
          type: string
          enum:
            - ltr
            - rtl
        lang_sort:
          type: integer
        lang_is_default:
          type: integer
          enum:
            - 0
            - 1

    LanguageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Language'

    LanguageListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Language'
            pagination:
              $ref: '#/components/schemas/Pagination'

    # Translation Schemas
    Translation:
      type: object
      properties:
        ID:
          type: integer
          example: 1
        lang_code:
          type: string
          example: en
        translation_key:
          type: string
          example: nav.dashboard
        translation_value:
          type: string
          example: Dashboard
        translation_context:
          type: string
          nullable: true
        is_html:
          type: integer
          enum:
            - 0
            - 1
          example: 0

    TranslationCreate:
      type: object
      required:
        - lang_code
        - translation_key
        - translation_value
      properties:
        lang_code:
          type: string
          example: en
        translation_key:
          type: string
          example: nav.dashboard
        translation_value:
          type: string
          example: Dashboard
        translation_context:
          type: string
          nullable: true
        is_html:
          type: integer
          enum:
            - 0
            - 1
          default: 0

    TranslationUpdate:
      type: object
      required:
        - translation_value
      properties:
        translation_value:
          type: string
          example: Dashboard
        translation_context:
          type: string
          nullable: true
        is_html:
          type: integer
          enum:
            - 0
            - 1

    TranslationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Translation'

    TranslationListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Translation'
            pagination:
              $ref: '#/components/schemas/Pagination'

    # Media Schemas
    MediaUpload:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          format: binary
          description: Image file (JPEG, PNG, GIF, WebP or BMP; max 5 MB)
        post_id:
          type: integer
          description: Optional post ID to link the image to via tbl_mediameta
          example: 1

    MediaUploadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                url:
                  type: string
                  example: http://blogware.site/public/files/pictures/abc123_1720000000.jpg
                filename:
                  type: string
                  example: abc123_1720000000.jpg
                media_id:
                  type: integer
                  example: 42
                post_id:
                  type: integer
                  nullable: true
                  example: 1

    # System Schemas
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required:
                - status
                - timestamp
                - php_version
              properties:
                status:
                  type: string
                  example: healthy
                timestamp:
                  type: string
                  example: 2026-07-30 12:00:00
                php_version:
                  type: string
                  example: 8.1.2

    CsrfTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required:
                - csrf_token
                - expires_in
              properties:
                csrf_token:
                  type: string
                  example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
                expires_in:
                  type: integer
                  description: Token lifetime in seconds
                  example: 3600

  responses:
    BadRequest:
      description: Bad Request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable Entity - Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptable:
      description: Not Acceptable - Requested media type not supported
      headers:
        Accept:
          description: Supported media types
          schema:
            type: string
            example: 'application/json'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Method Not Allowed - HTTP method not supported for this path
      headers:
        Allow:
          description: Methods registered for this path
          schema:
            type: string
            example: 'GET, POST, PUT, PATCH, DELETE, QUERY, OPTIONS'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Unsupported Media Type - write requests must send application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotModified:
      description: Not Modified - Resource has not changed (use cached version)
      headers:
        ETag:
          description: Entity tag for the resource
          schema:
            type: string
            example: '"abc123"'
        Last-Modified:
          description: Last modification timestamp
          schema:
            type: string
            format: date-time
        Cache-Control:
          description: Cache directives
          schema:
            type: string
            example: 'public, max-age=300'

externalDocs:
  description: Blogware Documentation
  url: https://blogware.site/docs

x-tagGroups:
  - name: Core
    tags:
      - API Info
      - System
  - name: Content
    tags:
      - Posts
      - Categories
      - Comments
      - Archives
  - name: Discovery
    tags:
      - Search
      - Query
  - name: Internationalization
    tags:
      - Languages
      - Translations
  - name: Compliance & Media
    tags:
      - GDPR
      - Media
