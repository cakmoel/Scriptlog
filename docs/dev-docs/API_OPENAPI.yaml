  /search:
    get:
      tags:
        - Search
      summary: Search all content
      description: |
        Searches posts and pages for the given keyword.
        This endpoint is public and does not require authentication.
        The keyword may also be passed as `keyword`. Minimum length is
        2 characters. A non-empty `search_verify` parameter (honeypot)
        is rejected with `403`. Besides the global read rate limit, an
        endpoint-local limit of 30 requests per minute applies (`429`).
      operationId: searchAll
      parameters:
        - name: q
          in: query
          description: Search keyword (alias `keyword`)
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: type
          in: query
          description: Search scope
          required: false
          schema:
            type: string
            enum:
              - all
              - posts
              - pages
            default: all
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /search/posts:
    get:
      tags:
        - Search
      summary: Search posts only
      description: |
        Searches only posts for the given keyword (`type` is forced to
        `posts` by the controller).
        This endpoint is public and does not require authentication.
        Same honeypot (`403`) and endpoint-local rate limit (`429`) as
        `GET /search` apply.
      operationId: searchPosts
      parameters:
        - name: q
          in: query
          description: Search keyword
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /search/pages:
    get:
      tags:
        - Search
      summary: Search pages only
