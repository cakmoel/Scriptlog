name: Secret Scan
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
jobs:
  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Guards the e2e credential remediation: no real passwords, API keys, or
    # other secrets may be (re)introduced into the tree or git history.
    # Documented test-only placeholders live in .gitleaks.toml with a
    # justification each; everything else matching a rule fails this job.
    # Uses the pinned OSS binary directly (no license key, fully reproducible).
    steps:
    - uses: actions/checkout@v4
      with:
        # Full history is required so past commits are scanned too.
        fetch-depth: 0

    - name: Install pinned Gitleaks OSS binary
      run: |
        curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        /tmp/gitleaks version

    - name: Scan history and tree for secrets
      run: /tmp/gitleaks detect --source . --redact --verbose
