name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # The e2e suite talks to a dedicated blogware_e2e database over 127.0.0.1:3306
    # (see e2e/blog-selectors.ts and e2e/gdpr-fixtures.ts), and the app's own
    # router (e2e/router.php) serves it over http://127.0.0.1:8099.
    # SECURITY: the MariaDB service below is an ephemeral throwaway container
    # (destroyed after the job). Its password is a non-production test default.
    # User passwords are NEVER committed: e2e/gdpr-fixtures.ts resolves
    # E2E_ADMIN_PASS / E2E_GDPR_PASS / E2E_NOACCESS_PASS from the environment
    # (GitHub Secrets when configured) or generates a per-run random value.
    # Configure optional repository secrets E2E_ADMIN_PASS, E2E_GDPR_PASS,
    # E2E_NOACCESS_PASS, E2E_DB_PASS for pinned values; forks without secrets
    # still pass via the ephemeral fallback. See e2e/.env.example.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: blogware_e2e
          MARIADB_USER: blogwareuser
          MARIADB_PASSWORD: ${{ secrets.E2E_DB_PASS || 'userblogware' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: pdo, pdo_mysql, mbstring, json, curl, gd, fileinfo, openssl
        tools: composer:v2

    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist
      env:
        COMPOSER_PLATFORM_CHECK: 'false'

    - name: Install MySQL client
      run: sudo apt-get update && sudo apt-get install -y mariadb-client

    - name: Materialize app configuration
      # config.php is gitignored, so it must be created on runners (admin/login.php
      # redirects to /install when it is missing). The e2e fixture carries
      # concrete values for the seeded database and dev server.
      run: cp e2e/config.ci.php config.php

    - name: Import seeded e2e database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u blogwareuser -p"$E2E_DB_PASS" blogware_e2e < e2e/blogware_e2e.sql
      env:
        E2E_DB_PASS: ${{ secrets.E2E_DB_PASS || 'userblogware' }}
        MYSQL_PWD: ${{ secrets.E2E_DB_PASS || 'userblogware' }}

    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Pinned only when repository secrets exist; otherwise the fixtures use
        # a per-run ephemeral password and sync the test DB to it at seed time.
        E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
        E2E_GDPR_PASS: ${{ secrets.E2E_GDPR_PASS }}
        E2E_NOACCESS_PASS: ${{ secrets.E2E_NOACCESS_PASS }}
        E2E_DB_PASS: ${{ secrets.E2E_DB_PASS || 'userblogware' }}
        E2E_DB_USER: blogwareuser
        E2E_DB_NAME: blogware_e2e

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30